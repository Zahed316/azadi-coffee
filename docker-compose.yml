services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme_root}
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-azadi_coffee}
      MYSQL_USER: ${WORDPRESS_DB_USER:-azadi}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    image: wordpress:6.8-php8.2-apache
    restart: unless-stopped
    volumes:
      - wordpress_data:/var/www/html
      - ./wp-content/plugins/azadi-headless-settings:/var/www/html/wp-content/plugins/azadi-headless-settings
      - ./wp-content/themes/azadi-headless:/var/www/html/wp-content/themes/azadi-headless
    environment:
      WORDPRESS_DB_HOST: mysql:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-azadi_coffee}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-azadi}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-changeme}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', '${WP_HOME:-https://azadicoffee.com}');
        define('WP_SITEURL', '${WP_SITEURL:-https://azadicoffee.com/wp}');
        define('WP_AUTO_UPDATE_CORE', false);
        define('DISALLOW_FILE_EDIT', true);
        define('FORCE_SSL_ADMIN', true);
        define('AZADI_FRONTEND_URL', '${NEXT_PUBLIC_SITE_URL:-https://azadicoffee.com}');
        define('AZADI_ALLOWED_ORIGINS', '${AZADI_ALLOWED_ORIGINS:-https://azadicoffee.com}');
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_az_}
    env_file:
      - path: .env.local
        required: false
    depends_on:
      mysql:
        condition: service_healthy

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORDPRESS_API_URL: ${WORDPRESS_API_URL:-https://azadicoffee.com/wp-json}
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-https://azadicoffee.com/wp}
      WOOCOMMERCE_CONSUMER_KEY: ${WOOCOMMERCE_CONSUMER_KEY}
      WOOCOMMERCE_CONSUMER_SECRET: ${WOOCOMMERCE_CONSUMER_SECRET}
      WORDPRESS_APPLICATION_USERNAME: ${WORDPRESS_APPLICATION_USERNAME}
      WORDPRESS_APPLICATION_PASSWORD: ${WORDPRESS_APPLICATION_PASSWORD}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://azadicoffee.com}
    env_file:
      - path: .env.local
        required: false
    depends_on:
      - wordpress

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_data:/var/www/certbot
      - static_data:/var/www/static
    depends_on:
      - nextjs
      - wordpress

  certbot:
    image: certbot/certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: >
      sh -c "trap exit TERM; while :; do
        certbot certonly --webroot -w /var/www/certbot
          --email ${CERTBOT_EMAIL:-admin@azadicoffee.com}
          --agree-tos --no-eff-email
          -d azadicoffee.com
          -d www.azadicoffee.com || true;
        sleep 12h & wait $${!}; done;"

volumes:
  mysql_data:
  wordpress_data:
  certbot_data:
  certbot_conf:
  static_data:
